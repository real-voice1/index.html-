<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REAL VOICE - غرف الدردشة الصوتية</title>
    <!-- مكتبة Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملف التصميم المخصص -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 bg-slate-950 text-white">

    <!-- 1. الشاشة الرئيسية / الترحيب -->
    <div id="welcome-screen" class="glass neon-border p-8 rounded-3xl w-full max-w-md text-center">
        <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-full mx-auto flex items-center justify-center mb-4 text-3xl shadow-lg shadow-purple-500/40">
            <i class="fa-solid fa-microphone-lines text-white"></i>
        </div>
        <h1 class="text-2xl font-black mb-1 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">REAL VOICE</h1>
        <p class="text-slate-400 text-xs mb-6">تطبيق الدردشة الصوتية والألعاب الاجتماعية</p>
        
        <button id="start-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition text-sm cursor-pointer">
            دخول التطبيق 🚀
        </button>
    </div>

    <!-- 2. شاشة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-screen" class="glass neon-border p-8 rounded-3xl w-full max-w-md hidden">
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent" id="auth-title">إنشاء حساب جديد</h2>
            <p class="text-xs text-slate-400 mt-1">انضم إلى مجتمع غرف الصوت والدردشة</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs text-purple-300 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl glass text-sm bg-transparent border border-purple-500/30 focus:outline-none focus:border-purple-500 text-white" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs text-purple-300 mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl glass text-sm bg-transparent border border-purple-500/30 focus:outline-none focus:border-purple-500 text-white" placeholder="••••••••">
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition text-sm cursor-pointer">
                تسجيل الحساب
            </button>
        </form>

        <div class="text-center mt-4">
            <button type="button" id="toggle-auth-mode" class="text-xs text-purple-300 hover:underline cursor-pointer">
                لديك حساب بالفعل؟ سجل دخولك من هنا
            </button>
        </div>
    </div>

    <!-- 3. شاشة قاعة الغرف الصوتية (Rooms Lobby) -->
    <div id="rooms-screen" class="glass neon-border p-6 rounded-3xl w-full max-w-md hidden">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-lg font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">غرف الدردشة المتاحة</h2>
                <p id="user-display-email" class="text-[10px] text-slate-400">مرحباً بك</p>
            </div>
            <button id="create-room-btn" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg hover:opacity-90 transition cursor-pointer">
                <i class="fa-solid fa-plus ml-1"></i> إنشاء غرفة
            </button>
        </div>

        <!-- قائمة الغرف -->
        <div id="rooms-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
            <p class="text-center text-slate-500 text-xs py-4">جاري تحميل الغرف...</p>
        </div>
    </div>

    <!-- نافذة منبثقة (Modal) لإنشاء غرفة جديدة -->
    <div id="create-room-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="glass neon-border p-6 rounded-3xl w-full max-w-sm text-center">
            <h3 class="text-lg font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-4">إنشاء غرفة صوتية جديدة</h3>
            
            <input type="text" id="room-name-input" placeholder="اسم الغرفة (مثلاً: سهرة فنانين 🎤)" class="w-full px-4 py-3 rounded-xl glass text-sm bg-transparent border border-purple-500/30 focus:outline-none focus:border-purple-500 text-white mb-4">
            
            <div class="flex gap-2">
                <button type="button" id="cancel-room-btn" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    إلغاء
                </button>
                <button type="button" id="confirm-create-room" class="w-1/2 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg hover:opacity-90 transition cursor-pointer">
                    إرسال وإنشاء
                </button>
            </div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الرئيسي بصيغة Module -->
    <script type="module" src="script.js"></script>
</body>
</html>
