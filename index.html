<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0d1c" />
<title>REAL VOICE</title>
<style>
  :root{
    --bg:#070914; --bg2:#0d1230; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.10);
    --txt:#f2f4ff; --sub:#9aa3c7; --pur:#8b5cf6; --blu:#3b82f6; --pink:#ec4899; --gold:#fbbf24; --red:#ef4444; --grn:#22c55e;
    --grad:linear-gradient(135deg,#8b5cf6,#3b82f6);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
  html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
  body{background:radial-gradient(900px 500px at 80% -10%,#2a1b6b55,transparent),radial-gradient(700px 500px at -10% 110%,#0b3a8a55,transparent),var(--bg)}
  button{border:none;color:inherit;background:none;cursor:pointer;font-size:14px}
  input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);font-size:15px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--pur)}
  select option{background:#10142b}
  .hidden{display:none!important}
  #app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column}
  .glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
  /* top bar */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0}
  .logo{font-weight:900;font-size:19px;letter-spacing:1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
  .chip{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:20px;font-size:13px;font-weight:bold}
  .iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
  .badge{position:absolute;top:-2px;left:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;flex-shrink:0;position:relative;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar.sm{width:36px;height:36px;font-size:13px}
  .avatar.lg{width:92px;height:92px;font-size:30px}
  .dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:#64748b;border:2px solid var(--bg)}
  .dot.on{background:var(--grn)}
  /* pages */
  #pages{flex:1;position:relative;overflow:hidden}
  .page{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 96px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .25s,transform .25s}
  .page.active{opacity:1;transform:none;pointer-events:auto}
  h2.title{font-size:18px;margin:14px 0 10px}
  .search{display:flex;gap:8px;align-items:center;padding:4px 12px;margin-bottom:10px}
  .search input{background:none;border:none;padding:10px 4px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:13px;color:var(--sub)}
  .tab.active{background:var(--grad);color:#fff;border-color:transparent}
  .row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
  .row .info{flex:1;min-width:0}
  .row .name{font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roomcover{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
  .btn{padding:11px 18px;border-radius:14px;font-weight:bold;background:var(--grad);color:#fff;font-size:14px}
  .btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
  .btn.ghost{background:var(--card);border:1px solid var(--line)}
  .btn.red{background:linear-gradient(135deg,#ef4444,#be123c)}
  .btn.block{width:100%;display:block;margin-top:10px}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(139,92,246,.25);color:#c4b5fd;margin-inline-start:6px}
  .tag.vip{background:rgba(251,191,36,.2);color:var(--gold)}
  .empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px}
  .fab{position:absolute;bottom:92px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--grad);font-size:28px;box-shadow:0 8px 24px #8b5cf688;z-index:5}
  .banner{padding:18px;margin:6px 0 4px;background:linear-gradient(135deg,#6d28d9aa,#1d4ed8aa);border-radius:20px}
  .banner h3{font-size:17px;margin-bottom:6px}.banner p{font-size:12px;color:#dbe4ff;margin-bottom:12px}
  /* nav */
  #bottom-nav{position:absolute;bottom:10px;left:12px;right:12px;display:flex;padding:8px;border-radius:24px;background:rgba(14,18,44,.85);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:16px;color:var(--sub);font-size:11px;position:relative}
  .navbtn .ic{font-size:21px}
  .navbtn.active{color:#fff;background:var(--grad)}
  .navbtn .badge{top:0;left:50%;margin-left:6px}
  /* profile */
  .cover{height:110px;border-radius:20px;background:var(--grad)}
  .pfhead{display:flex;flex-direction:column;align-items:center;margin-top:-46px}
  .frame{padding:4px;border-radius:50%;background:conic-gradient(var(--gold),var(--pink),var(--blu),var(--gold))}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .stat{padding:12px 4px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--sub)}
  .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .4s}
  .ach{display:flex;gap:8px;flex-wrap:wrap}
  .ach span{padding:7px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px}
  .ach span.off{opacity:.35}
  /* overlays */
  .overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);transform:translateX(-100%);transition:transform .3s;background-image:radial-gradient(700px 400px at 50% -10%,#3b1d8a66,transparent)}
  .overlay.open{transform:none}
  .ohead{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-shrink:0}
  .ohead .t{flex:1;min-width:0}.ohead .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ohead .t small{color:var(--sub);font-size:12px}
  /* seats */
  .seats{display:grid;gap:10px 6px;padding:8px 12px;flex-shrink:0}
  .seat{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .seatav{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.07);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;color:var(--sub)}
  .seat.occ .seatav{border:2px solid transparent;background:var(--grad);color:#fff;font-weight:bold;font-size:18px}
  .seat.speak .seatav{animation:pulse 1.1s infinite;border-color:var(--grn)}
  .seat.locked .seatav{border-color:var(--red);color:var(--red)}
  .seat.vip .seatav{border-color:var(--gold)}
  .seatname{font-size:11px;max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seatsub{font-size:10px;color:var(--sub)}
  .mutedmark{position:absolute;bottom:-3px;left:-3px;background:var(--red);border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e99}70%{box-shadow:0 0 0 12px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
  .pinned{margin:0 12px 6px;padding:8px 12px;font-size:12px;color:var(--gold);border-radius:12px;background:rgba(251,191,36,.1)}
  .chatbox{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:7px}
  .msg{max-width:88%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;word-break:break-word;align-self:flex-start}
  .msg.me{align-self:flex-end;background:rgba(139,92,246,.28)}
  .msg .who{font-size:11px;color:#a5b4fc;margin-bottom:2px}
  .msg .tm{font-size:10px;color:var(--sub);margin-top:3px}
  .msg.sys{align-self:center;background:none;border:none;color:var(--sub);font-size:12px}
  .msg.col-pink{color:#f9a8d4}.msg.col-gold{color:var(--gold)}.msg.col-green{color:#86efac}.msg.col-blue{color:#93c5fd}
  .composer{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-shrink:0}
  .composer input{flex:1;padding:11px 14px;border-radius:22px}
  .rbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px;flex-shrink:0}
  .rbtn.on{background:var(--grad)}.rbtn.off{background:var(--red)}
  .emojis{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;flex-shrink:0}
  .emojis button{font-size:22px;padding:4px 6px}
  .colors{display:flex;gap:8px;padding:0 12px 8px;align-items:center;font-size:12px;color:var(--sub)}
  .colors button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
  .colors button.sel{border-color:#fff}
  /* sheets / modal */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-height:82%;overflow-y:auto;background:#10142b;border-radius:24px 24px 0 0;padding:18px 16px 24px;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .3s}
  .scrim.open .sheet{transform:none}
  .sheet h3{margin-bottom:12px;font-size:17px}
  .sheet label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
  .giftgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .gift{padding:10px 2px;text-align:center;border-radius:14px;background:var(--card);border:2px solid transparent}
  .gift.sel{border-color:var(--pur);background:rgba(139,92,246,.2)}
  .gift .e{font-size:30px}.gift small{display:block;font-size:11px;color:var(--sub);margin-top:2px}.gift .p{color:var(--gold);font-size:11px;font-weight:bold}
  .actlist button{display:block;width:100%;padding:14px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:right;font-size:15px}
  .actlist button.danger{color:#fca5a5}
  .fly{position:absolute;z-index:90;font-size:70px;left:50%;top:55%;transform:translate(-50%,0);pointer-events:none;animation:fly 2.4s ease-out forwards;text-align:center}
  .fly small{display:block;font-size:13px;color:#fff;background:rgba(0,0,0,.55);border-radius:12px;padding:4px 10px;margin-top:6px}
  @keyframes fly{0%{opacity:0;transform:translate(-50%,60px) scale(.4)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}80%{opacity:1;transform:translate(-50%,-90px) scale(1)}100%{opacity:0;transform:translate(-50%,-150px) scale(.9)}}
  #toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-90px);z-index:100;background:#1e2550;border:1px solid var(--line);padding:11px 18px;border-radius:16px;font-size:13px;max-width:90%;text-align:center;transition:transform .3s}
  #toast.show{transform:translate(-50%,0)}
  .switchrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
  .small{font-size:12px;color:var(--sub)}
  .voicenote{font-size:11px;color:var(--sub);text-align:center;padding:4px 12px}
</style>
</head>
<body>
<div id="app">

  <!-- الصفحة الرئيسية الثابتة -->
  <div class="topbar" id="topbar">
    <div class="logo">REAL VOICE</div>
    <div class="chip glass">🪙 <span id="coins-top">0</span></div>
    <div class="chip glass">⭐ <span id="level-top">1</span></div>
    <button class="iconbtn glass" id="notif-btn" type="button" aria-label="الإشعارات">🔔<span class="badge hidden" id="notif-badge">0</span></button>
    <button class="avatar sm" id="avatar-top" type="button" aria-label="ملفي"></button>
  </div>

  <div id="pages">
    <!-- الرئيسية -->
    <section class="page active" id="page-home">
      <div class="banner">
        <h3>أهلاً بك في REAL VOICE 🎙️</h3>
        <p>ادخل غرفة صوتية وتحدث مع أصدقائك الآن</p>
        <button class="btn sm ghost" id="banner-create" type="button">+ أنشئ غرفتك</button>
      </div>
      <div class="search glass"><span>🔍</span><input id="search-input" type="search" placeholder="ابحث عن غرفة أو مستخدم أو ID" /></div>
      <div class="tabs" id="home-tabs">
        <button class="tab active" data-filter="all" type="button">الكل</button>
        <button class="tab" data-filter="popular" type="button">🔥 الأكثر شعبية</button>
        <button class="tab" data-filter="new" type="button">✨ جديدة</button>
        <button class="tab" data-filter="friends" type="button">👥 أصدقاء</button>
        <button class="tab" data-filter="vip" type="button">👑 VIP</button>
        <button class="tab" data-filter="games" type="button">🎮 ألعاب</button>
      </div>
      <div id="search-users" class="hidden"></div>
      <div id="home-rooms"></div>
      <button class="btn ghost block" id="refresh-rooms" type="button">🔄 تحديث قائمة الغرف</button>
    </section>

    <!-- الغرف -->
    <section class="page" id="page-rooms">
      <h2 class="title">غرفي والغرف النشطة</h2>
      <div class="tabs" id="rooms-tabs">
        <button class="tab active" data-rfilter="mine" type="button">غرفي</button>
        <button class="tab" data-rfilter="active" type="button">النشطة الآن</button>
      </div>
      <div id="rooms-list"></div>
      <button class="fab" id="fab-create" type="button" aria-label="إنشاء غرفة">＋</button>
    </section>

    <!-- الأصدقاء -->
    <section class="page" id="page-friends">
      <h2 class="title">الأصدقاء</h2>
      <div class="tabs" id="friends-tabs">
        <button class="tab active" data-ftab="friends" type="button">أصدقائي</button>
        <button class="tab" data-ftab="requests" type="button">الطلبات <span id="req-count"></span></button>
        <button class="tab" data-ftab="find" type="button">بحث</button>
      </div>
      <div class="search glass hidden" id="find-box"><span>🔍</span><input id="find-input" type="search" placeholder="اسم المستخدم أو ID" /></div>
      <div id="friends-list"></div>
    </section>

    <!-- الرسائل -->
    <section class="page" id="page-messages">
      <h2 class="title">الرسائل الخاصة</h2>
      <div id="dm-list"></div>
    </section>

    <!-- الملف الشخصي -->
    <section class="page" id="page-profile">
      <div class="cover"></div>
      <div class="pfhead">
        <div class="frame"><div class="avatar lg" id="pf-avatar"></div></div>
        <h2 style="margin-top:8px" id="pf-name"></h2>
        <div class="small" id="pf-id"></div>
        <div style="margin-top:6px" id="pf-badges"></div>
      </div>
      <div class="glass" style="padding:14px;margin-top:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span>المستوى <b id="pf-level"></b></span><span class="small" id="pf-xp"></span></div>
        <div class="bar"><i id="pf-bar" style="width:0"></i></div>
      </div>
      <div class="stats">
        <div class="stat glass"><b id="pf-coins">0</b><span>🪙 العملات</span></div>
        <div class="stat glass"><b id="pf-friends">0</b><span>الأصدقاء</span></div>
        <div class="stat glass"><b id="pf-visits">0</b><span>مرات الدخول</span></div>
        <div class="stat glass"><b id="pf-followers">0</b><span>المتابعون</span></div>
        <div class="stat glass"><b id="pf-following">0</b><span>يتابع</span></div>
        <div class="stat glass"><b id="pf-gifts">0</b><span>🎁 هدايا مستلمة</span></div>
      </div>
      <div class="glass" style="padding:14px;margin-bottom:12px">
        <b style="font-size:14px">نبذة</b>
        <p class="small" style="margin-top:6px;line-height:1.7" id="pf-bio"></p>
        <p class="small" style="margin-top:6px" id="pf-meta"></p>
      </div>
      <div class="glass" style="padding:14px;margin-bottom:12px">
        <b style="font-size:14px">الإنجازات</b>
        <div class="ach" style="margin-top:10px" id="pf-ach"></div>
      </div>
      <button class="btn block" id="pf-edit" type="button">✏️ تعديل الملف الشخصي</button>
      <button class="btn ghost block" id="pf-topup" type="button">🪙 إضافة 500 عملة (رصيد تجريبي)</button>
      <button class="btn ghost block" id="pf-leader" type="button">🏆 لوحة الترتيب</button>
      <button class="btn ghost block" id="pf-settings" type="button">⚙️ الإعدادات</button>
    </section>
  </div>

  <nav id="bottom-nav">
    <button class="navbtn active" data-page="home" type="button"><span class="ic">🏠</span>الرئيسية</button>
    <button class="navbtn" data-page="rooms" type="button"><span class="ic">🎙️</span>الغرف</button>
    <button class="navbtn" data-page="friends" type="button"><span class="ic">👥</span>الأصدقاء<span class="badge hidden" id="friends-badge">0</span></button>
    <button class="navbtn" data-page="messages" type="button"><span class="ic">💬</span>الرسائل<span class="badge hidden" id="msg-badge">0</span></button>
    <button class="navbtn" data-page="profile" type="button"><span class="ic">👤</span>حسابي</button>
  </nav>

  <!-- واجهة الغرفة الصوتية -->
  <div class="overlay" id="room-view">
    <div class="ohead">
      <button class="iconbtn glass" id="room-back" type="button" aria-label="رجوع">➜</button>
      <div class="t"><b id="room-title"></b><small id="room-sub"></small></div>
      <button class="iconbtn glass" id="room-share" type="button" aria-label="مشاركة">🔗</button>
      <button class="iconbtn glass" id="room-menu" type="button" aria-label="القائمة">⋮</button>
    </div>
    <div class="pinned hidden" id="room-pinned"></div>
    <div class="seats" id="room-seats"></div>
    <div class="chatbox" id="room-chat"></div>
    <div class="emojis" id="room-emojis"></div>
    <div class="colors" id="room-colors">لون الرسالة:
      <button data-color="" style="background:#fff" class="sel" type="button"></button>
      <button data-color="pink" style="background:#f9a8d4" type="button"></button>
      <button data-color="gold" style="background:#fbbf24" type="button"></button>
      <button data-color="green" style="background:#86efac" type="button"></button>
      <button data-color="blue" style="background:#93c5fd" type="button"></button>
    </div>
    <div class="composer">
      <button class="rbtn on" id="mic-btn" type="button" aria-label="المايك">🎤</button>
      <input id="room-input" type="text" maxlength="200" placeholder="اكتب رسالة..." />
      <button class="rbtn" id="room-send" type="button" aria-label="إرسال">➤</button>
      <button class="rbtn" id="room-gift" type="button" aria-label="هدية">🎁</button>
    </div>
  </div>

  <!-- محادثة خاصة -->
  <div class="overlay" id="chat-view">
    <div class="ohead">
      <button class="iconbtn glass" id="chat-back" type="button" aria-label="رجوع">➜</button>
      <div class="avatar sm" id="chat-avatar"></div>
      <div class="t"><b id="chat-title"></b><small id="chat-sub"></small></div>
      <button class="iconbtn glass" id="chat-menu" type="button" aria-label="القائمة">⋮</button>
    </div>
    <div class="chatbox" id="chat-msgs"></div>
    <div class="composer">
      <button class="rbtn" id="chat-emoji" type="button" aria-label="إيموجي">😊</button>
      <input id="chat-input" type="text" maxlength="300" placeholder="اكتب رسالة خاصة..." />
      <button class="rbtn on" id="chat-send" type="button" aria-label="إرسال">➤</button>
    </div>
  </div>

  <!-- نافذة سفلية عامة (قوائم، إنشاء غرفة، إشعارات...) -->
  <div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
